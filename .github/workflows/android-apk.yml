name: HISAB Global V7 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build HISAB Android
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # 1. CHECKOUT
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # =====================================================
      # 2. NODE
      # =====================================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # =====================================================
      # 3. JAVA
      # =====================================================
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # =====================================================
      # 4. CHECK SOURCE FILES
      # =====================================================
      - name: Check HISAB source files
        shell: bash
        run: |
          set -e

          test -f index.html
          test -f app.js
          test -f style.css
          test -f package.json
          test -f capacitor.config.ts

          echo "Source files OK."

      # =====================================================
      # 5. CHECK APP.JS
      # =====================================================
      - name: Validate app.js
        shell: bash
        run: |
          set -e

          node --check app.js

          echo "app.js syntax OK."

      # =====================================================
      # 6. CHECK INDEX.HTML
      # =====================================================
      - name: Validate index.html
        shell: bash
        run: |
          set -e

          echo "Validating index.html..."

          grep -qi '<html' index.html

          if grep -qi 'app\.js' index.html; then
            echo "External app.js reference found."
          elif grep -qi '<script' index.html; then
            echo "Inline script found."
          else
            echo "ERROR: No JavaScript found in index.html."
            exit 1
          fi

          if grep -qi 'style\.css' index.html; then
            echo "External style.css reference found."
          elif grep -qi '<style' index.html; then
            echo "Inline CSS found."
          else
            echo "ERROR: No CSS found in index.html."
            exit 1
          fi

          echo "index.html OK."

      # =====================================================
      # 7. INSTALL DEPENDENCIES
      # =====================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          echo "Dependencies installed."

      # =====================================================
      # 8. CHECK CAPACITOR
      # =====================================================
      - name: Check Capacitor
        shell: bash
        run: |
          set -e

          npx cap --version

          echo "Capacitor OK."

      # =====================================================
      # 9. BUILD WEB APP
      # =====================================================
      - name: Build web app
        shell: bash
        run: |
          set -e

          rm -rf www

          npm run build

          test -f www/index.html
          test -f www/app.js
          test -f www/style.css

          echo "Web build OK."

      # =====================================================
      # 10. PREPARE ANDROID
      # =====================================================
      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          if [ ! -d android ] || [ ! -f android/gradlew ]; then
            echo "Android project not found."
            echo "Creating Android project..."

            npx cap add android
          else
            echo "Existing Android project found."
          fi

          test -d android
          test -f android/gradlew

          chmod +x android/gradlew

          echo "Android project ready."

      # =====================================================
      # 11. CAPACITOR SYNC
      # =====================================================
      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -e

          npx cap sync android

          echo "Capacitor Android sync OK."

      # =====================================================
      # 12. VERIFY ANDROID WEB ASSETS
      # =====================================================
      - name: Verify Android web assets
        shell: bash
        run: |
          set -e

          PUBLIC_DIR="android/app/src/main/assets/public"

          test -d "$PUBLIC_DIR"
          test -f "$PUBLIC_DIR/index.html"
          test -f "$PUBLIC_DIR/app.js"
          test -f "$PUBLIC_DIR/style.css"

          node --check "$PUBLIC_DIR/app.js"

          echo "Android web assets OK."

      # =====================================================
      # 13. CONFIGURE ADMOB
      # =====================================================
      - name: Configure AdMob
        shell: bash
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          set -e

          if [ -z "$ADMOB_APP_ID" ]; then
            echo "ADMOB_APP_ID secret not configured."
            echo "Skipping AdMob configuration."
            exit 0
          fi

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST_FILE"

          mkdir -p "$(dirname "$STRINGS_FILE")"

          python3 - "$STRINGS_FILE" "$ADMOB_APP_ID" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          file_path = sys.argv[1]
          app_id = sys.argv[2]

          try:
              tree = ET.parse(file_path)
              root = tree.getroot()
          except Exception:
              root = ET.Element("resources")
              tree = ET.ElementTree(root)

          found = False

          for item in root.findall("string"):
              if item.get("name") == "admob_app_id":
                  item.text = app_id
                  found = True
                  break

          if not found:
              item = ET.SubElement(root, "string")
              item.set("name", "admob_app_id")
              item.text = app_id

          tree.write(
              file_path,
              encoding="utf-8",
              xml_declaration=True
          )
          PY

          python3 - "$MANIFEST_FILE" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          file_path = sys.argv[1]

          ANDROID_NS = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", ANDROID_NS)

          tree = ET.parse(file_path)
          root = tree.getroot()

          application = root.find("application")

          if application is None:
              raise SystemExit("ERROR: application not found.")

          name_key = "{" + ANDROID_NS + "}name"
          value_key = "{" + ANDROID_NS + "}value"

          target_name = "com.google.android.gms.ads.APPLICATION_ID"

          found = False

          for meta in application.findall("meta-data"):
              if meta.get(name_key) == target_name:
                  meta.set(
                      value_key,
                      "@string/admob_app_id"
                  )
                  found = True
                  break

          if not found:
              meta = ET.SubElement(
                  application,
                  "meta-data"
              )

              meta.set(
                  name_key,
                  target_name
              )

              meta.set(
                  value_key,
                  "@string/admob_app_id"
              )

          tree.write(
              file_path,
              encoding="utf-8",
              xml_declaration=True
          )
          PY

          echo "AdMob configuration OK."

      # =====================================================
      # 14. VERIFY ADMOB
      # =====================================================
      - name: Verify AdMob
        shell: bash
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          set -e

          if [ -z "$ADMOB_APP_ID" ]; then
            echo "AdMob secret not supplied."
            echo "AdMob verification skipped."
            exit 0
          fi

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"

          test -f "$STRINGS_FILE"
          test -f "$MANIFEST_FILE"

          grep -q 'name="admob_app_id"' "$STRINGS_FILE"

          grep -q \
            'com.google.android.gms.ads.APPLICATION_ID' \
            "$MANIFEST_FILE"

          grep -q \
            '@string/admob_app_id' \
            "$MANIFEST_FILE"

          echo "AdMob verification OK."

      # =====================================================
      # 15. CHECK GRADLE
      # =====================================================
      - name: Check Gradle
        shell: bash
        working-directory: android
        run: |
          set -e

          chmod +x gradlew

          ./gradlew --version

      # =====================================================
      # 16. CLEAN
      # =====================================================
      - name: Clean Android
        shell: bash
        working-directory: android
        run: |
          set -e

          ./gradlew clean --no-daemon

      # =====================================================
      # 17. BUILD DEBUG APK
      # =====================================================
      - name: Build Debug APK
        shell: bash
        working-directory: android
        run: |
          set -e

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon

      # =====================================================
      # 18. VERIFY DEBUG APK
      # =====================================================
      - name: Verify Debug APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          unzip -t "$APK" >/dev/null

          ls -lh "$APK"

          echo "Debug APK OK."

      # =====================================================
      # 19. UPLOAD DEBUG APK
      # =====================================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HISAB-GLOBAL-V7-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # =====================================================
      # 20. RELEASE AAB
      # =====================================================
      # Release build is attempted only if Gradle release
      # configuration is available. Debug APK remains the
      # main test build.
      # =====================================================
      - name: Build Release AAB
        shell: bash
        working-directory: android
        continue-on-error: true
        run: |
          ./gradlew bundleRelease \
            --stacktrace \
            --no-daemon

      # =====================================================
      # 21. VERIFY RELEASE AAB
      # =====================================================
      - name: Verify Release AAB
        shell: bash
        continue-on-error: true
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ -f "$AAB" ]; then
            unzip -t "$AAB" >/dev/null
            ls -lh "$AAB"
            echo "Release AAB OK."
          else
            echo "Release AAB was not generated."
            echo "This does not fail the Debug APK build."
          fi

      # =====================================================
      # 22. UPLOAD RELEASE AAB IF AVAILABLE
      # =====================================================
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: HISAB-GLOBAL-V7-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      # =====================================================
      # 23. BUILD SUMMARY
      # =====================================================
      - name: Build Summary
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "       HISAB GLOBAL V7 BUILD"
          echo "=============================================="
          echo ""

          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "DEBUG APK: SUCCESS"
            ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          else
            echo "DEBUG APK: NOT FOUND"
          fi

          echo ""

          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            echo "RELEASE AAB: SUCCESS"
            ls -lh android/app/build/outputs/bundle/release/app-release.aab
          else
            echo "RELEASE AAB: NOT GENERATED"
          fi

          echo ""
          echo "=============================================="
