name: HISAB Global V7 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "=== Repository files ==="
          ls -la

          test -f index.html
          test -f app.js
          test -f style.css
          test -f package.json

          test -f capacitor.config.ts || \
          test -f capacitor.config.js || \
          test -f capacitor.config.json

          echo "Source files found."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true

      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Install dependencies
        run: |
          npm install

      - name: Build Web Assets
        run: |
          npm run build

          echo "=== Built www files ==="
          ls -lh www/

          test -f www/index.html
          test -f www/app.js
          test -f www/style.css

          echo "Web assets built successfully."

      - name: Verify Capacitor
        run: |
          npx cap --version

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Verify Android project
        run: |
          test -d android
          test -f android/gradlew

          test -f android/app/build.gradle || \
          test -f android/app/build.gradle.kts

          echo "Android project verified."

      - name: Verify Web Assets
        run: |
          test -f www/index.html
          test -f www/app.js
          test -f www/style.css

          echo "=== Web assets ==="
          ls -lh www/

      - name: Verify Gradle Java
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        working-directory: android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "=== APK FILE ==="
          ls -lh "$APK"

          echo "=== APK ZIP INTEGRITY ==="
          unzip -t "$APK" > /dev/null
          echo "APK ZIP integrity check passed."

          echo "=== APK SIGNATURE ==="
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          echo "Using: $APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

          echo "=== APK PACKAGE INFORMATION ==="
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)

          if [ -z "$AAPT" ]; then
            echo "ERROR: aapt not found"
            exit 1
          fi

          "$AAPT" dump badging "$APK" | head -n 5

          echo "=== APK VERIFICATION COMPLETE ==="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HISAB-GLOBAL-V7-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
