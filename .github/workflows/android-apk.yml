name: HISAB Global V7 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract HISAB V7
        run: |
          unzip -o HISAB_GLOBAL_V7_CLEAN.zip
          cp -R HISAB_GLOBAL_V7_CLEAN/. .
          rm -rf HISAB_GLOBAL_V7_CLEAN

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true

      - name: Force Java 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install

      - name: Verify Capacitor
        run: npx cap --version

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Gradle Java
        working-directory: android
        run: ./gradlew --version

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HISAB-GLOBAL-V7-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
