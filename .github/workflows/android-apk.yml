name: HISAB Global V7 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build HISAB Android
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v5


      # =====================================================
      # 2. NODE 22
      # No npm cache because package-lock.json is not required
      # =====================================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'


      # =====================================================
      # 3. JAVA 21
      # =====================================================
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'


      # =====================================================
      # 4. CHECK REQUIRED SOURCE FILES
      # =====================================================
      - name: Check HISAB source files
        shell: bash
        run: |
          set -e

          echo "Checking HISAB source files..."

          test -f index.html
          test -f app.js
          test -f style.css
          test -f package.json

          echo "All required source files found."

          echo "Node:"
          node --version

          echo "npm:"
          npm --version


      # =====================================================
      # 5. CHECK app.js
      # =====================================================
      - name: Validate app.js
        shell: bash
        run: |
          set -e

          node --check app.js

          echo "app.js syntax check PASSED."


      # =====================================================
      # 6. CHECK index.html
      # =====================================================
      - name: Validate index.html
        shell: bash
        run: |
          set -e

          grep -qi '<html' index.html
          grep -qi 'app.js' index.html
          grep -qi 'style.css' index.html

          echo "index.html check PASSED."


      # =====================================================
      # 7. CHECK OLD repair.js REFERENCE
      # =====================================================
      - name: Check JavaScript references
        shell: bash
        run: |
          set -e

          if grep -qi 'repair.js' index.html; then
            echo "ERROR: index.html still references repair.js"
            echo "Remove the repair.js script reference from index.html."
            exit 1
          fi

          echo "No repair.js reference in index.html."


      # =====================================================
      # 8. INSTALL DEPENDENCIES
      # =====================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            echo "package-lock.json found - using npm ci"
            npm ci
          else
            echo "package-lock.json not found - using npm install"
            npm install
          fi

          echo "Dependencies installed."


      # =====================================================
      # 9. CHECK CAPACITOR
      # =====================================================
      - name: Check Capacitor
        shell: bash
        run: |
          set -e

          npx cap --version

          echo "Capacitor check PASSED."


      # =====================================================
      # 10. BUILD WEB APP
      # =====================================================
      - name: Build HISAB web files
        shell: bash
        run: |
          set -e

          npm run build

          echo "Web build completed."


      # =====================================================
      # 11. VERIFY WWW
      # =====================================================
      - name: Verify www files
        shell: bash
        run: |
          set -e

          test -d www
          test -f www/index.html
          test -f www/app.js
          test -f www/style.css

          node --check www/app.js

          echo "www verification PASSED."


      # =====================================================
      # 12. VERIFY BUILT HTML
      # =====================================================
      - name: Verify built index.html
        shell: bash
        run: |
          set -e

          grep -qi '<html' www/index.html
          grep -qi 'app.js' www/index.html
          grep -qi 'style.css' www/index.html

          if grep -qi 'repair.js' www/index.html; then
            echo "ERROR: www/index.html references repair.js"
            exit 1
          fi

          echo "Built HTML verification PASSED."


      # =====================================================
      # 13. CHECK CAPACITOR CONFIG
      # =====================================================
      - name: Check Capacitor configuration
        shell: bash
        run: |
          set -e

          if [ -f capacitor.config.ts ]; then
            echo "capacitor.config.ts found"
            cat capacitor.config.ts

          elif [ -f capacitor.config.json ]; then
            echo "capacitor.config.json found"
            cat capacitor.config.json

          else
            echo "ERROR: No Capacitor configuration found."
            exit 1
          fi


      # =====================================================
      # 14. CHECK EXISTING ANDROID PROJECT
      # IMPORTANT:
      # Do NOT delete android
      # Do NOT run cap add android
      # =====================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          if [ ! -d android ]; then
            echo "ERROR: android folder does not exist."
            exit 1
          fi

          if [ ! -f android/gradlew ]; then
            echo "ERROR: android/gradlew not found."
            exit 1
          fi

          chmod +x android/gradlew

          echo "Existing Android project found."


      # =====================================================
      # 15. CAPACITOR SYNC
      # =====================================================
      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -e

          npx cap sync android

          echo "Capacitor sync PASSED."


      # =====================================================
      # 16. VERIFY ANDROID WEB ASSETS
      # =====================================================
      - name: Verify Android web assets
        shell: bash
        run: |
          set -e

          PUBLIC_DIR="android/app/src/main/assets/public"

          if [ ! -d "$PUBLIC_DIR" ]; then
            echo "ERROR: Android public assets folder not found."
            exit 1
          fi

          test -f "$PUBLIC_DIR/index.html"
          test -f "$PUBLIC_DIR/app.js"
          test -f "$PUBLIC_DIR/style.css"

          node --check "$PUBLIC_DIR/app.js"

          if grep -qi 'repair.js' "$PUBLIC_DIR/index.html"; then
            echo "ERROR: Android index.html references repair.js"
            exit 1
          fi

          echo "Android web assets verification PASSED."


      # =====================================================
      # 17. CONFIGURE ADMOB
      # Only changes AdMob when secret exists.
      # Existing configuration is preserved otherwise.
      # =====================================================
      - name: Configure AdMob
        shell: bash
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          set -e

          if [ -z "$ADMOB_APP_ID" ]; then
            echo "ADMOB_APP_ID secret is not configured."
            echo "Keeping existing AdMob configuration."
            exit 0
          fi

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST_FILE"

          mkdir -p "$(dirname "$STRINGS_FILE")"

          python3 - "$STRINGS_FILE" "$ADMOB_APP_ID" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          file_path = sys.argv[1]
          app_id = sys.argv[2]

          try:
              tree = ET.parse(file_path)
              root = tree.getroot()
          except Exception:
              root = ET.Element("resources")
              tree = ET.ElementTree(root)

          found = False

          for item in root.findall("string"):
              if item.get("name") == "admob_app_id":
                  item.text = app_id
                  found = True
                  break

          if not found:
              item = ET.SubElement(root, "string")
              item.set("name", "admob_app_id")
              item.text = app_id

          tree.write(
              file_path,
              encoding="utf-8",
              xml_declaration=True
          )
          PY

          python3 - "$MANIFEST_FILE" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          file_path = sys.argv[1]

          ANDROID_NS = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", ANDROID_NS)

          tree = ET.parse(file_path)
          root = tree.getroot()

          application = root.find("application")

          if application is None:
              raise SystemExit(
                  "ERROR: <application> not found in AndroidManifest.xml"
              )

          name_key = "{" + ANDROID_NS + "}name"
          value_key = "{" + ANDROID_NS + "}value"

          target_name = "com.google.android.gms.ads.APPLICATION_ID"

          found = False

          for meta in application.findall("meta-data"):
              if meta.get(name_key) == target_name:
                  meta.set(value_key, "@string/admob_app_id")
                  found = True
                  break

          if not found:
              meta = ET.SubElement(application, "meta-data")
              meta.set(name_key, target_name)
              meta.set(value_key, "@string/admob_app_id")

          tree.write(
              file_path,
              encoding="utf-8",
              xml_declaration=True
          )
          PY

          echo "AdMob configuration completed."


      # =====================================================
      # 18. VERIFY ADMOB IF CONFIGURED
      # =====================================================
      - name: Verify AdMob
        shell: bash
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          set -e

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"

          if [ -z "$ADMOB_APP_ID" ]; then
            echo "No AdMob secret supplied."
            echo "Skipping AdMob verification."
            exit 0
          fi

          test -f "$STRINGS_FILE"
          test -f "$MANIFEST_FILE"

          grep -q 'name="admob_app_id"' "$STRINGS_FILE"

          grep -q \
            'com.google.android.gms.ads.APPLICATION_ID' \
            "$MANIFEST_FILE"

          grep -q \
            '@string/admob_app_id' \
            "$MANIFEST_FILE"

          echo "AdMob verification PASSED."


      # =====================================================
      # 19. GRADLE VERSION
      # =====================================================
      - name: Check Gradle
        shell: bash
        working-directory: android
        run: |
          set -e

          ./gradlew --version


      # =====================================================
      # 20. CLEAN
      # =====================================================
      - name: Clean Android project
        shell: bash
        working-directory: android
        run: |
          set -e

          ./gradlew clean --no-daemon


      # =====================================================
      # 21. BUILD DEBUG APK
      # =====================================================
      - name: Build Debug APK
        shell: bash
        working-directory: android
        run: |
          set -e

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon


      # =====================================================
      # 22. VERIFY DEBUG APK
      # =====================================================
      - name: Verify Debug APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          echo "Debug APK:"
          ls -lh "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK integrity check PASSED."


      # =====================================================
      # 23. BUILD RELEASE AAB
      # =====================================================
      - name: Build Release AAB
        shell: bash
        working-directory: android
        run: |
          set -e

          ./gradlew bundleRelease \
            --stacktrace \
            --no-daemon


      # =====================================================
      # 24. VERIFY RELEASE AAB
      # =====================================================
      - name: Verify Release AAB
        shell: bash
        run: |
          set -e

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: Release AAB was not generated."
            exit 1
          fi

          echo "Release AAB:"
          ls -lh "$AAB"

          unzip -t "$AAB" >/dev/null

          echo "AAB integrity check PASSED."


      # =====================================================
      # 25. UPLOAD DEBUG APK
      # =====================================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HISAB-GLOBAL-V7-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      # =====================================================
      # 26. UPLOAD RELEASE AAB
      # =====================================================
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: HISAB-GLOBAL-V7-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error


      # =====================================================
      # 27. FINAL RESULT
      # =====================================================
      - name: Build Summary
        shell: bash
        run: |
          echo ""
          echo "================================================"
          echo "        HISAB GLOBAL V7 BUILD SUCCESS"
          echo "================================================"
          echo ""
          echo "APK:"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          echo ""
          echo "AAB:"
          ls -lh android/app/build/outputs/bundle/release/app-release.aab
          echo ""
          echo "================================================"
