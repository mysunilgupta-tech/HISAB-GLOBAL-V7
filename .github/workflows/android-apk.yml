name: HISAB Global V7 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract HISAB V7
        run: |
          unzip -o HISAB_GLOBAL_V7_CLEAN.zip
          cp -R HISAB_GLOBAL_V7_CLEAN/. .
          rm -rf HISAB_GLOBAL_V7_CLEAN

      - name: Check project files
        run: |
          echo "=== Project files ==="
          ls -la

          echo "=== package.json ==="
          test -f package.json
          cat package.json

          echo "=== Capacitor config ==="
          if [ -f capacitor.config.json ]; then
            cat capacitor.config.json
          elif [ -f capacitor.config.ts ]; then
            cat capacitor.config.ts
          elif [ -f capacitor.config.js ]; then
            cat capacitor.config.js
          else
            echo "ERROR: Capacitor config not found"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true

      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Install dependencies
        run: |
          npm install

      - name: Verify Capacitor
        run: |
          npx cap --version

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Verify Android project
        run: |
          test -d android
          test -f android/gradlew
