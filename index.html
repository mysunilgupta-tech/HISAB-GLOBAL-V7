<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a2e4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HISAB V9.1</title>

<style>
:root{
  --bg:#f4f7fb;--card:#fff;--primary:#0a2e4a;--primary2:#145b8d;
  --accent:#16a36f;--blue:#2478b8;--danger:#d84d4d;--orange:#e89025;
  --text:#102338;--muted:#718198;--border:#e3ebf3;
  --soft:#edf5fa;--greenbg:#eaf8f2;--redbg:#fff0f0;
  --shadow:0 8px 24px rgba(15,45,70,.08);--shadow2:0 3px 12px rgba(15,45,70,.06);
  --radius:18px
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:82px}
header{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  padding:12px 15px
}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#0a2e4a,#1975ad);
  color:#fff;display:grid;place-items:center;font-size:25px;font-weight:900;
  box-shadow:0 5px 14px rgba(10,46,74,.2)
}
.brand h1{font-size:20px;margin:0;font-weight:900}
.brand small{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1.2px}
.top-actions{display:flex;gap:7px}
.iconbtn{
  border:1px solid var(--border);background:#fff;border-radius:12px;
  width:40px;height:40px;font-size:18px
}
main{padding:15px}
.page{display:none;animation:fade .18s ease}
.page.active{display:block}
@keyframes fade{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}

.hero{
  background:linear-gradient(135deg,#0a2e4a,#145b8d);
  color:#fff;border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px
}
.hero h2{margin:0 0 4px;font-size:24px}
.hero p{margin:0;color:#d9e8f4;font-size:13px}
.hero-row{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.hero-balance{font-size:28px;font-weight:900}
.modebar{display:flex;background:#eaf0f5;border-radius:14px;padding:4px;margin-bottom:14px}
.modebar button{
  flex:1;border:0;background:transparent;padding:11px;border-radius:11px;
  color:var(--muted);font-weight:800
}
.modebar button.active{background:#fff;color:var(--primary);box-shadow:var(--shadow2)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:15px;box-shadow:var(--shadow2)
}
.stat{min-height:95px}
.stat small{display:block;color:var(--muted);font-weight:700;font-size:11px}
.stat strong{display:block;font-size:21px;margin-top:7px}
.green strong{color:var(--accent)}
.red strong{color:var(--danger)}
.blue strong{color:var(--blue)}
.section-title{
  display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px
}
.section-title h3{margin:0;font-size:17px}
.section-title button{border:0;background:none;color:var(--primary2);font-weight:800}

.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.action{
  background:#fff;border:1px solid var(--border);border-radius:16px;padding:13px 8px;
  text-align:center;box-shadow:var(--shadow2);font-weight:800;color:var(--text)
}
.action span{display:block;font-size:23px;margin-bottom:5px}
.action small{font-size:11px}

.list{display:grid;gap:9px}
.item{
  background:#fff;border:1px solid var(--border);border-radius:16px;padding:13px;
  box-shadow:var(--shadow2)
}
.item-head{display:flex;justify-content:space-between;gap:10px}
.item-title{font-weight:900}
.item-sub{color:var(--muted);font-size:12px;margin-top:4px}
.amount{font-weight:900;font-size:17px}
.receive{color:var(--accent)}.give{color:var(--danger)}
.pending{color:var(--orange)}.paid{color:var(--accent)}
.partial{color:var(--blue)}
.item-actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.btn{
  border:0;border-radius:11px;padding:9px 12px;font-weight:800;
  background:var(--primary);color:#fff
}
.btn.green{background:var(--accent)}
.btn.blue{background:var(--blue)}
.btn.red{background:var(--danger)}
.btn.light{background:var(--soft);color:var(--primary)}
.btn.gray{background:#eef1f4;color:#44566a}
.btn.small{padding:7px 9px;font-size:12px}
.btn.full{width:100%;padding:12px}

.backbar{display:flex;gap:8px;margin-bottom:12px}
.backbar button{flex:1}

.form{display:grid;gap:11px}
label{font-size:12px;font-weight:800;color:#506277}
input,select,textarea{
  width:100%;border:1px solid var(--border);background:#fff;border-radius:12px;
  padding:12px;color:var(--text);outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--primary2)}
textarea{min-height:75px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:3px;margin-bottom:12px}
.tabs button{
  white-space:nowrap;border:1px solid var(--border);background:#fff;
  color:var(--muted);border-radius:12px;padding:9px 12px;font-weight:800
}
.tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.search{margin-bottom:10px}
.progress{height:8px;background:#e9eef3;border-radius:20px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:20px}
.badge{
  display:inline-block;border-radius:20px;padding:4px 8px;font-size:10px;
  font-weight:900;background:#edf1f5;color:#58697a
}
.badge.green{background:var(--greenbg);color:#08794f}
.badge.red{background:var(--redbg);color:#b72f2f}
.badge.blue{background:#eaf3fb;color:#17679f}
.badge.orange{background:#fff4df;color:#a96400}

.bottom{
  position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);
  width:min(720px,100%);background:#fff;border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(4,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom))
}
.bottom button{border:0;background:none;color:#738196;font-size:10px;font-weight:800;padding:5px}
.bottom button b{display:block;font-size:20px;margin-bottom:2px}
.bottom button.active{color:var(--primary)}

.overlay{
  position:fixed;inset:0;background:rgba(8,28,43,.48);z-index:100;
  display:none;align-items:flex-end;justify-content:center
}
.overlay.show{display:flex}
.modal{
  width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;
  border-radius:24px 24px 0 0;padding:18px
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-head h3{margin:0}
.close{border:0;background:#eef2f5;border-radius:10px;width:38px;height:38px;font-size:20px}
hr{border:0;border-top:1px solid var(--border);margin:14px 0}
.empty{text-align:center;padding:25px 10px;color:var(--muted)}
.pin-screen{
  position:fixed;inset:0;background:linear-gradient(145deg,#0a2e4a,#145b8d);
  z-index:200;display:none;align-items:center;justify-content:center;padding:20px
}
.pin-screen.show{display:flex}
.pinbox{
  background:#fff;border-radius:24px;padding:24px;width:min(390px,100%);text-align:center
}
.pinbox .logo{margin:0 auto 12px}
.pin-dots{font-size:25px;letter-spacing:7px;margin:15px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.keypad button{height:55px;border:0;background:#eef3f7;border-radius:14px;font-size:19px;font-weight:900}
.toast{
  position:fixed;z-index:300;left:50%;bottom:90px;transform:translateX(-50%);
  background:#102338;color:#fff;padding:11px 16px;border-radius:12px;
  display:none;max-width:90%;font-size:13px
}
.toast.show{display:block}
@media(max-width:390px){
  .actions{grid-template-columns:repeat(2,1fr)}
  .grid3{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<div id="pinScreen" class="pin-screen">
  <div class="pinbox">
    <div class="logo">H</div>
    <h2>HISAB</h2>
    <p id="pinTitle">Security PIN</p>
    <div id="pinDots" class="pin-dots">○○○○</div>
    <div id="pinError" style="color:#d84d4d;font-size:12px;min-height:18px"></div>
    <div class="keypad">
      <button onclick="pinKey('1')">1</button>
      <button onclick="pinKey('2')">2</button>
      <button onclick="pinKey('3')">3</button>
      <button onclick="pinKey('4')">4</button>
      <button onclick="pinKey('5')">5</button>
      <button onclick="pinKey('6')">6</button>
      <button onclick="pinKey('7')">7</button>
      <button onclick="pinKey('8')">8</button>
      <button onclick="pinKey('9')">9</button>
      <button onclick="pinClear()">⌫</button>
      <button onclick="pinKey('0')">0</button>
      <button onclick="pinCancel()">×</button>
    </div>
  </div>
</div>

<div class="app">

<header>
  <div class="top">
    <div class="brand">
      <div class="logo">H</div>
      <div>
        <h1>HISAB</h1>
        <small>TRACK • PLAN • GROW</small>
      </div>
    </div>
    <div class="top-actions">
      <button class="iconbtn" onclick="openBackup()">💾</button>
      <button class="iconbtn" onclick="openSecurity()">🔐</button>
    </div>
  </div>
</header>

<main>

<!-- HOME -->
<section id="page-home" class="page active">
  <div class="hero">
    <h2>Namaste 👋</h2>
    <p>Apna paisa aur hisaab ek jagah manage karein.</p>
    <div class="hero-row">
      <div>
        <small>Net Balance
